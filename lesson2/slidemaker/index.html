<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLスライド → 編集可能PPTX</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PptxGenJS for PPTX generation -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center font-sans p-4">

    <!-- メインUIコンテナ -->
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">HTMLスライド → 編集可能PPTX</h1>
            <p class="text-sm text-slate-500">HTMLファイルを解析し、テキストを編集可能な状態でPowerPoint形式に変換します。</p>
        </div>
        
        <!-- フォント選択エリア (アコーディオン化・デフォルト:メイリオ) -->
        <div class="mb-6 border border-slate-200 rounded-lg bg-white overflow-hidden shadow-sm">
            <details class="group">
                <summary class="flex justify-between items-center font-medium cursor-pointer list-none p-4 text-slate-700 hover:bg-slate-50 transition-colors">
                    <span class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                        出力フォントの設定 (デフォルト: メイリオ)
                    </span>
                    <span class="transition group-open:rotate-180">
                        <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                    </span>
                </summary>
                <div class="p-4 border-t border-slate-200 bg-slate-50/50">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- メイリオ -->
                        <label class="relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm hover:bg-slate-50 transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-blue-500">
                            <input type="radio" name="fontSelection" value="Meiryo" class="sr-only" checked>
                            <div class="flex flex-col w-full">
                                <span class="block text-sm font-bold text-slate-900" style="font-family: 'Meiryo UI', Meiryo, sans-serif;">メイリオ (Meiryo)</span>
                                <span class="mt-1 block text-xs text-slate-500 leading-relaxed" style="font-family: 'Meiryo UI', Meiryo, sans-serif;">画面表示に最適化されたゴシック体。<br>スライドで非常に読みやすいです。</span>
                            </div>
                        </label>
                        <!-- 游ゴシック -->
                        <label class="relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm hover:bg-slate-50 transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-blue-500">
                            <input type="radio" name="fontSelection" value="Yu Gothic" class="sr-only">
                            <div class="flex flex-col w-full">
                                <span class="block text-sm font-bold text-slate-900" style="font-family: 'Yu Gothic', sans-serif;">游ゴシック (Yu Gothic)</span>
                                <span class="mt-1 block text-xs text-slate-500 leading-relaxed" style="font-family: 'Yu Gothic', sans-serif;">美しい日本語フォント。<br>視認性が高く幅広く使えます。</span>
                            </div>
                        </label>
                        <!-- 游明朝 -->
                        <label class="relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm hover:bg-slate-50 transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-blue-500">
                            <input type="radio" name="fontSelection" value="Yu Mincho" class="sr-only">
                            <div class="flex flex-col w-full">
                                <span class="block text-sm font-bold text-slate-900" style="font-family: 'Yu Mincho', serif;">游明朝 (Yu Mincho)</span>
                                <span class="mt-1 block text-xs text-slate-500 leading-relaxed" style="font-family: 'Yu Mincho', serif;">標準的な明朝体。<br>フォーマルな印象を与えたい場合に。</span>
                            </div>
                        </label>
                        <!-- MS Pゴシック -->
                        <label class="relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm hover:bg-slate-50 transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-blue-500">
                            <input type="radio" name="fontSelection" value="MS PGothic" class="sr-only">
                            <div class="flex flex-col w-full">
                                <span class="block text-sm font-bold text-slate-900" style="font-family: 'MS PGothic', sans-serif;">ＭＳ Ｐゴシック (MS PGothic)</span>
                                <span class="mt-1 block text-xs text-slate-500 leading-relaxed" style="font-family: 'MS PGothic', sans-serif;">古くからある標準フォント。<br>互換性重視の用途におすすめです。</span>
                            </div>
                        </label>
                    </div>
                </div>
            </details>
        </div>

        <!-- ドラッグ＆ドロップエリア -->
        <div id="drop-zone" class="mb-6 border-2 border-dashed border-slate-300 rounded-lg p-10 text-center cursor-pointer hover:bg-slate-50 transition-colors">
            <svg class="mx-auto h-12 w-12 text-slate-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="text-sm text-slate-600 mb-2">ここにHTMLファイルをドロップ</p>
            <p class="text-xs text-slate-400 mb-4">または</p>
            <input type="file" id="fileInput" accept=".html" class="hidden"/>
            <button type="button" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" onclick="document.getElementById('fileInput').click()">
                ファイルを選択
            </button>
            <p id="selected-file-name" class="mt-4 text-sm font-bold text-blue-600 truncate hidden"></p>
        </div>
        
        <button id="convertBtn" class="w-full flex items-center justify-center gap-2 bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition-colors disabled:opacity-60 disabled:cursor-not-allowed" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            PPTXに変換してダウンロード
        </button>
        
        <!-- 進捗表示エリア -->
        <div id="progress-container" class="mt-6 hidden">
            <div class="flex items-center justify-between text-sm text-slate-600 mb-2">
                <span id="status-text" class="flex items-center gap-2">
                    <div class="loader"></div>
                    処理を準備中...
                </span>
                <span id="progress-percent" class="font-medium">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- キャプチャ処理用の隠しiframe -->
    <div style="position: absolute; left: -9999px; top: -9999px; width: 960px; height: 540px; overflow: hidden;">
        <iframe id="render-frame" style="width: 960px; height: 540px; border: none; background: white;"></iframe>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('fileInput');
            const selectedFileName = document.getElementById('selected-file-name');
            const convertBtn = document.getElementById('convertBtn');
            const progressContainer = document.getElementById('progress-container');
            const statusBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            const progressPercent = document.getElementById('progress-percent');
            const renderFrame = document.getElementById('render-frame');

            let selectedFile = null;

            // --- ドラッグ＆ドロップのイベント設定 ---
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('bg-blue-50', 'border-blue-400'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('bg-blue-50', 'border-blue-400'), false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                handleFiles(dt.files);
            });

            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });

            function handleFiles(files) {
                if (files.length > 0) {
                    const file = files[0];
                    if (file.type === 'text/html' || file.name.toLowerCase().endsWith('.html')) {
                        selectedFile = file;
                        selectedFileName.textContent = `選択中: ${file.name}`;
                        selectedFileName.classList.remove('hidden');
                        convertBtn.disabled = false;
                    } else {
                        alert('HTMLファイルを選択してください。');
                        selectedFile = null;
                        selectedFileName.classList.add('hidden');
                        convertBtn.disabled = true;
                    }
                }
            }

            // --- 変換処理 ---
            convertBtn.addEventListener('click', async () => {
                if (!selectedFile) return;

                convertBtn.disabled = true;
                progressContainer.classList.remove('hidden');
                updateProgress(0, 'ファイルを読み込んでいます...');

                try {
                    const htmlText = await selectedFile.text();
                    await processHtmlToEditablePptx(htmlText, selectedFile.name);
                    updateProgress(100, '変換が完了しました！');
                    
                    setTimeout(() => {
                        progressContainer.classList.add('hidden');
                        convertBtn.disabled = false;
                    }, 3000);

                } catch (error) {
                    console.error('変換エラー:', error);
                    statusText.innerHTML = `<span class="text-red-600 font-bold">エラー: ${error.message}</span>`;
                    statusBar.classList.remove('bg-blue-600');
                    statusBar.classList.add('bg-red-500');
                    convertBtn.disabled = false;
                }
            });

            function updateProgress(percent, text) {
                statusBar.style.width = `${percent}%`;
                progressPercent.textContent = `${Math.round(percent)}%`;
                
                if (percent === 100) {
                    statusText.innerHTML = `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>${text}`;
                } else {
                    statusText.innerHTML = `<div class="loader"></div>${text}`;
                }
            }

            // --- ユーティリティ関数 ---
            function rgbToHex(rgb) {
                if (!rgb || rgb === 'rgba(0, 0, 0, 0)' || rgb === 'transparent') return null;
                let match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*(\d+(?:\.\d+)?))?\)$/);
                if (!match) return null;
                if (match[4] === '0') return null;
                function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); }
                return (hex(match[1]) + hex(match[2]) + hex(match[3])).toUpperCase();
            }

            function pxToInch(px) {
                return px / 96;
            }

            // CSSの疑似要素 (::before) から背景画像のURL（Base64化されたSVGなど）を抽出する関数
            function getListStyleImageFromPseudo(el, iframeWin) {
                try {
                    const pseudoStyle = iframeWin.getComputedStyle(el, '::before');
                    const bgImage = pseudoStyle.backgroundImage;
                    if (bgImage && bgImage !== 'none') {
                        const match = bgImage.match(/^url\((['"]?)(.*?)\1\)$/);
                        if (match && match[2]) {
                            let url = match[2].replace(/\\"/g, '"');
                            // Data URIスキームかどうかを判定
                            if (url.startsWith('data:')) {
                                // SVGデータがURLエンコードされている場合、Base64に変換して返す
                                if (url.startsWith('data:image/svg+xml,') || url.startsWith('data:image/svg+xml;utf8,')) {
                                    // 接頭辞を取り除いてデコード
                                    let svgString = url.replace(/^data:image\/svg\+xml(?:;utf8)?,/, '');
                                    svgString = decodeURIComponent(svgString);
                                    
                                    // PptxGenJSはBase64エンコードされたSVGを要求するため変換する
                                    const svg64 = btoa(unescape(encodeURIComponent(svgString)));
                                    return 'data:image/svg+xml;base64,' + svg64;
                                }
                                // すでにBase64形式であればそのまま返す
                                if (url.includes(';base64,')) {
                                    return url;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn('疑似要素の背景画像抽出エラー', e);
                }
                return null;
            }

            // --- PPTXへ要素をパース・追加する関数 ---
            async function parseElementToPptx(el, pptxSlide, slideRect, iframeWin, selectedFont) {
                const computedStyle = iframeWin.getComputedStyle(el);
                if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden' || computedStyle.opacity === '0') return;
                
                const excludeSelectors = ['.controls', 'button', '.pagination', '.slide-header-line'];
                if (excludeSelectors.some(selector => el.matches(selector))) return;

                const rect = el.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                
                const x = pxToInch(rect.left - slideRect.left);
                const y = pxToInch(rect.top - slideRect.top);
                const w = pxToInch(rect.width);
                const h = pxToInch(rect.height);
                const nodeName = el.nodeName.toLowerCase();

                // 1. 背景色・ボーダー (Shape)
                const bgColor = rgbToHex(computedStyle.backgroundColor);
                const borderStyle = computedStyle.borderTopStyle;
                const borderWidth = parseFloat(computedStyle.borderTopWidth);
                const borderColor = rgbToHex(computedStyle.borderTopColor);

                if ((bgColor && bgColor !== 'FFFFFF' && bgColor !== '000000' && parseFloat(computedStyle.backgroundColor.split(',')[3]) !== 0) || 
                    (borderStyle !== 'none' && borderWidth > 0)) {
                    
                    let shapeOptions = { x, y, w, h };
                    if (bgColor) shapeOptions.fill = { color: bgColor };
                    if (borderStyle !== 'none' && borderWidth > 0 && borderColor) {
                        shapeOptions.line = { color: borderColor, width: borderWidth };
                    }
                    
                    const borderRadius = parseFloat(computedStyle.borderRadius);
                    shapeOptions.shape = borderRadius > 0 ? iframeWin.pres.ShapeType.roundRect : iframeWin.pres.ShapeType.rect;
                    pptxSlide.addShape(shapeOptions.shape, shapeOptions);
                }

                // 2. SVG または 画像
                if (nodeName === 'svg') {
                    try {
                        const clonedSvg = el.cloneNode(true);
                        if (!clonedSvg.getAttribute('width')) clonedSvg.setAttribute('width', rect.width);
                        if (!clonedSvg.getAttribute('height')) clonedSvg.setAttribute('height', rect.height);

                        const xml = new XMLSerializer().serializeToString(clonedSvg);
                        const svg64 = btoa(unescape(encodeURIComponent(xml)));
                        const image64 = 'data:image/svg+xml;base64,' + svg64;

                        pptxSlide.addImage({ data: image64, x, y, w, h });
                    } catch (e) { console.warn('SVGキャプチャ失敗', e); }
                    return; 
                }

                if (nodeName === 'img') {
                    pptxSlide.addImage({ path: el.src, x, y, w, h });
                    return;
                }

                // 3. テキストの抽出 (箇条書き対応含む)
                const blockTags = ['div', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li', 'td', 'th'];
                const inlineTags = ['span', 'strong', 'em', 'a', 'br', 'b', 'i', 'font'];
                let isTextContainer = false;

                if (!inlineTags.includes(nodeName)) {
                    const hasBlockChild = Array.from(el.querySelectorAll('*')).some(child => blockTags.includes(child.nodeName.toLowerCase()));
                    if (!hasBlockChild) {
                        const textContent = el.innerText || el.textContent;
                        if (textContent.trim().length > 0) isTextContainer = true;
                    }
                }

                if (isTextContainer) {
                    let textContent = el.innerText || el.textContent;
                    
                    if (textContent.trim()) {
                        const fontSizePx = parseFloat(computedStyle.fontSize);
                        const fontSizePt = fontSizePx * 0.75;
                        const fontColor = rgbToHex(computedStyle.color) || '000000';
                        const fontWeight = computedStyle.fontWeight;
                        const isBold = fontWeight === 'bold' || parseInt(fontWeight) >= 600;
                        const pt = parseFloat(computedStyle.paddingTop) || 0;
                        const pl = parseFloat(computedStyle.paddingLeft) || 0;
                        
                        let align = 'left';
                        if (computedStyle.textAlign === 'center') align = 'center';
                        if (computedStyle.textAlign === 'right') align = 'right';

                        let textOptions = {
                            x: x + pxToInch(pl),
                            y: y + pxToInch(pt),
                            w: w, 
                            h: h, 
                            fontSize: fontSizePt,
                            color: fontColor,
                            bold: isBold,
                            fontFace: selectedFont,
                            align: align,
                            valign: 'top',
                            margin: 0,
                            wrap: true,
                            autoFit: true
                        };

                        // 箇条書き処理
                        if (nodeName === 'li') {
                            textOptions.bullet = true;
                            if (pl > 0) {
                                textOptions.indentLevel = 1; 
                                textOptions.bulletMargin = pxToInch(pl) * 72; 
                            }

                            const customBulletImage = getListStyleImageFromPseudo(el, iframeWin);
                            if (customBulletImage) {
                                textOptions.bullet = false; 
                                const pseudoStyle = iframeWin.getComputedStyle(el, '::before');
                                let pseudoW = parseFloat(pseudoStyle.width) || fontSizePx;
                                let pseudoH = parseFloat(pseudoStyle.height) || fontSizePx;
                                
                                try {
                                    pptxSlide.addImage({ 
                                        data: customBulletImage, 
                                        x: textOptions.x - pxToInch(pseudoW) - 0.05,
                                        y: textOptions.y + (pxToInch(fontSizePx) - pxToInch(pseudoH))/2,
                                        w: pxToInch(pseudoW), 
                                        h: pxToInch(pseudoH) 
                                    });
                                } catch (imgErr) {
                                    textOptions.bullet = true;
                                }
                            }
                        }
                        pptxSlide.addText(textContent, textOptions);
                    }
                }
                
                for (const child of el.children) {
                    await parseElementToPptx(child, pptxSlide, slideRect, iframeWin, selectedFont);
                }
            }

            // --- メイン処理ループ ---
            async function processHtmlToEditablePptx(htmlString, originalFileName) {
                return new Promise((resolve, reject) => {
                    const selectedFont = document.querySelector('input[name="fontSelection"]:checked').value;
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlString, 'text/html');
                    
                    const scripts = doc.querySelectorAll('script');
                    scripts.forEach(s => s.remove());

                    const style = doc.createElement('style');
                    style.textContent = `
                        * { transition: none !important; animation: none !important; }
                        body { 
                            margin: 0 !important; padding: 0 !important; 
                            width: 960px !important; height: 540px !important; 
                            display: flex !important; align-items: flex-start !important; justify-content: flex-start !important;
                            overflow: hidden !important; background: transparent !important; min-height: auto !important;
                        }
                        .slider-container { 
                            width: 960px !important; height: 540px !important; max-width: none !important; 
                            border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; position: relative !important;
                        }
                        .controls, button { display: none !important; }
                        .slide { opacity: 0 !important; visibility: hidden !important; position: absolute !important; top: 0 !important; left: 0 !important; z-index: 1 !important;}
                        .slide.capture-active { opacity: 1 !important; visibility: visible !important; position: relative !important; z-index: 10 !important;}
                    `;
                    doc.head.appendChild(style);

                    const processedHtml = doc.documentElement.outerHTML;

                    renderFrame.onload = async () => {
                        try {
                            const iframeWin = renderFrame.contentWindow;
                            const iframeDoc = iframeWin.document;
                            
                            const slides = Array.from(iframeDoc.querySelectorAll('.slide'));
                            if (slides.length === 0) throw new Error('スライドが見つかりません。');

                            updateProgress(10, 'PPTXファイルを準備中...');
                            
                            // iframeWin内にPptxGenJSインスタンスを持たせておく（定数アクセス用）
                            iframeWin.pres = new PptxGenJS();
                            const pres = iframeWin.pres;
                            pres.layout = 'LAYOUT_16x9';

                            const container = iframeDoc.querySelector('.slider-container');
                            const containerRect = container.getBoundingClientRect();

                            for (let i = 0; i < slides.length; i++) {
                                updateProgress(10 + ((i / slides.length) * 70), `スライド ${i + 1} / ${slides.length} を解析中...`);
                                
                                slides.forEach(s => s.classList.remove('capture-active', 'active'));
                                slides[i].classList.add('capture-active');
                                
                                await new Promise(r => setTimeout(r, 100));

                                const pptxSlide = pres.addSlide();
                                
                                const slideBgColor = rgbToHex(iframeWin.getComputedStyle(slides[i]).backgroundColor);
                                const containerBgColor = rgbToHex(iframeWin.getComputedStyle(container).backgroundColor);
                                const finalBgColor = (slideBgColor && slideBgColor !== 'FFFFFF' && slideBgColor !== '000000') ? slideBgColor : 
                                                     (containerBgColor && containerBgColor !== 'FFFFFF' && containerBgColor !== '000000' ? containerBgColor : 'F0F4F8');
                                
                                pptxSlide.background = { color: finalBgColor };

                                const headerLine = slides[i].querySelector('.slide-header-line');
                                if (headerLine) {
                                     pptxSlide.addShape(pres.ShapeType.rect, {
                                         x: 0, y: 0, w: '100%', h: pxToInch(8),
                                         fill: { color: '196DAC' } 
                                     });
                                }

                                const children = Array.from(slides[i].children);
                                for (const child of children) {
                                     await parseElementToPptx(child, pptxSlide, containerRect, iframeWin, selectedFont);
                                }
                            }

                            updateProgress(90, 'ファイルを生成中...');
                            const outFileName = originalFileName.replace(/\.[^/.]+$/, "") + "_converted.pptx";
                            await pres.writeFile({ fileName: outFileName });
                            resolve();

                        } catch (err) {
                            reject(err);
                        }
                    };

                    renderFrame.onerror = () => reject(new Error('HTMLのレンダリングに失敗しました。'));
                    renderFrame.srcdoc = processedHtml;
                });
            }
        });
    </script>
</body>
